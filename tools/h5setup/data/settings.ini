; Osiris settings. Read at launch (Osiris.exe on Windows, the Osiris app on the PS5).
; Every line is NAME=VALUE. Set a value to 0 to turn that option off. Lines starting with ; are ignored.
; The defaults below are what the campaign was tested with; you normally don't need to change anything.

; FORGE_OFFLINE_LOBBY=1     Solo uses the game's own offline campaign lobby (no "connecting to lobby")
; FORGE_UI_RETAIN=1         keeps the pause menu and HUD loaded during missions
; FORGE_OFFLINE_ERRORS=1    hides the account popups that can't apply offline (authorization, profile sync)
; FORGE_RESIDENCY_GUARD=1   skips released GPU resources the renderer still lists (prevents a crash after long play)
; FORGE_ENGINE_LOG=1        writes the game's warnings and errors to h5campaign\logs\game.log (all = everything)
; FORGE_TRACE_EXC=1         records crashes in h5campaign\logs\game.log
; FORGE_WINDOW=fullscreen    fullscreen (borderless, default) or windowed; Alt+Enter switches while playing
; FORGE_DISPLAY_OPTIONS=1   144/180 FPS frame rate choices and the campaign field of view slider in Settings
; FORGE_MUTE=1              mutes the game (for testing)
; FORGE_EXIT_COMBO=0        turns off the controller exit combo (hold View + LB + RB for 3 seconds)
; FORGE_HANG_WATCH=1        if the picture freezes, logs what the game is stuck on (times = CPU times only, 0 = off)

; Graphics debugging (VKD3D_* and DXVK_* are passed to the graphics layers). For a GPU hang on the PS5:
; VKD3D_CONFIG=breadcrumbs,fault
; VKD3D_LOG_FILE=h5campaign\logs\vkd3d.log
